[pytest]
# Warnings policy: OUR deprecations are defects — error on anything from agent/, api/, evals/ code paths
# would be ideal, but pytest filters match by origin module, so the practical rule is: keep this list
# EMPTY of first-party entries. The single ignore below is a pinned THIRD-PARTY deprecation
# (unstructured on Python 3.14 uses asyncio.iscoroutinefunction, removed upstream in newer releases).
# Do not widen it — a new warning appearing in test output should be read as a defect, not noise.
filterwarnings =
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:unstructured.utils
