# Workflow · a2a   (FRAME flow — governance across a service boundary)
# Real flow (agent/a2a.py + scripts/a2a_demo.py) → pattern (PATTERNS.md) → controls (MANIFEST). The callee
# runs the same governed graph as gated-action; this file captures what the A2A boundary adds.

name: a2a
title: "Agent-to-agent — the human gate propagates across the boundary"
business_request: >
  Another agent (or an automated caller) calls this agent over HTTP to get a task done. Any side effect the
  callee proposes STILL requires human approval — even though the calling agent has no approval authority of
  its own. Governance composes across the boundary.

pattern: prompt-chaining          # one of the 5 canonical patterns (PATTERNS.md §2)
pattern_note: "across a service boundary + a propagated HITL gate"
pattern_source: workflows/PATTERNS.md
determination: >
  The caller's steps are known and linear (PATTERNS.md §3b), but the caller has NO approval authority: the
  HITL gate is a control that rides across the A2A boundary (§3d) — the interrupt propagates and only the
  caller's approval_channel can release it (abstain = deny, fail closed).

graph_flow: >
  caller POST /run → on `interrupt` hand the proposal to approval_channel → POST /approve echoing the SEEN
  hashes. (The callee internally runs the gated-action graph.)

steps:
  - node: "POST /run (callee graph)"
    does: "the callee runs its governed graph; a side-effect proposal raises an interrupt returned to the caller"
    tools: [search_kb, submit_action]
    controls: [D-004, D-034]               # HITL interrupt intact across the boundary · approval binds to proposal_hash
  - node: "interrupt across the boundary"
    does: "the caller has no approval authority; its ONLY release path is its approval_channel; abstain = deny (fail closed)"
    tools: []
    controls: [D-045, D-033]               # authz still runs pre-gate · deterministic authorize()
  - node: "POST /approve (echo SEEN hashes)"
    does: "the human/channel approves by echoing exactly the hashes it was shown; execution recomputes and refuses a mutated call"
    tools: []
    controls: [D-034]                      # binds to what was SEEN · hash recompute-and-refuse

not_exposed_over_mcp:
  controls: [D-025]
  why: >
    the governed graph is deliberately NOT published over MCP — there is no approval channel over stdio, so
    it would either hang or force auto-approve. MCP publishes READ tools only (D-025).

tools_used:
  read:   [search_kb]
  action: [submit_action]

human_gate:
  point: "callee approval node, surfaced to the caller's approval_channel"
  why: "even an agent-initiated side effect hits the human gate; the caller cannot self-release, and abstain = deny"
